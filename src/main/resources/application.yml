spring:
  application:
    name: identity

  datasource:
    url: jdbc:postgresql://${DB_URL:localhost}:${DB_PORT:5432}/tripbus_identity
    username: ${DB_USERNAME:tripbus}
    password: ${DB_PASSWORD:tripbus_local_pw}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

security:
  argon2:
    salt-length: ${ARGON2_SALT_LENGTH:16}
    hash-length: ${ARGON2_HASH_LENGTH:32}
    parallelism: ${ARGON2_PARALLELISM:1}
    memory: ${ARGON2_MEMORY:19456}
    iterations: ${ARGON2_ITERATIONS:2}

  jwt:
    private-key-path: ${JWT_PRIVATE_KEY_PATH:}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:}
    key-id: ${JWT_KEY_ID:identity-key-1}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

server:
  port: 16001
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # Redis solo se usa para publicar eventos (best effort): no debe tumbar el readiness.
    redis:
      enabled: false
  metrics:
    tags:
      application: identity

tripbus:
  events:
    enabled: ${EVENTS_ENABLED:true}
    stream: ${EVENTS_STREAM:tripbus:events}
  demo-users:
    enabled: ${DEMO_USERS_ENABLED:false}
    password: ${DEMO_USERS_PASSWORD:TripBus2026}
