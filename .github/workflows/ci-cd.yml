# CI/CD de identity:
#   secretos   -> Gitleaks sobre todo el historial git.
#   build-test -> compila, pruebas (unitarias, H2 e integración con PostgreSQL vía Testcontainers),
#                 cobertura JaCoCo y, si existe el secreto SONAR_TOKEN, análisis + quality gate en SonarQube Cloud.
#   docker     -> construye la imagen, la escanea con Trivy y, solo en push, la publica en GHCR.
# Las actions están fijadas por SHA de commit (inmutable); el comentario indica la versión.
name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secretos:
    name: Secretos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Imagen oficial en vez de gitleaks-action (esa exige licencia en organizaciones).
      # Los falsos positivos revisados están en .gitleaksignore.
      - name: Gitleaks
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo zricethezav/gitleaks:v8.30.1 \
            git /repo --redact --no-banner -v

  build-test:
    name: Compilar, probar y analizar
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # Sonar necesita el historial para saber qué código es nuevo

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Testcontainers usa el Docker del runner: no hacen falta services de postgres/redis.
      - name: Pruebas + SonarQube Cloud (falla si no pasa el quality gate)
        if: env.SONAR_TOKEN != ''
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.qualitygate.wait=true

      - name: Pruebas (sin Sonar)
        if: env.SONAR_TOKEN == ''
        run: |
          echo "::warning::Falta configurar el secreto SONAR_TOKEN: se omite el análisis de SonarQube Cloud."
          mvn -B verify

      - name: Reportes de pruebas
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

      - name: Reporte de cobertura
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jacoco
          path: target/site/jacoco/
          if-no-files-found: ignore

  docker:
    name: Imagen Docker (Trivy y publicación)
    needs: [secretos, build-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/identity
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Primero se construye y se carga en el Docker local (sin publicar) para escanearla.
      - name: Construir imagen
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          push: false
          build-args: GIT_COMMIT=${{ github.sha }}
          tags: identity:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy (vulnerabilidades CRITICAL/HIGH con corrección disponible)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: identity:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
          # Aceptadas sin arreglo en Spring Boot 3.x, con fecha de vencimiento.
          trivyignores: .trivyignore.yaml

      - name: Login a GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Mismo build (sale de la caché) pero publicando con los tags definitivos.
      - name: Publicar imagen
        if: github.event_name == 'push'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          build-args: GIT_COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
