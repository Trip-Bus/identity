# Perfil "prod": servidor de producción (activa también "desplegado"). Sin usuarios de demostración.
tripbus:
  demo-users:
    enabled: false

logging:
  level:
    com.tripbus: INFO

# Logs en JSON (ECS) por defecto en PROD, como antes. La variable de entorno LOG_FORMAT gana sobre este valor.
LOG_FORMAT: json

# Swagger/OpenAPI apagado en producción (solo IDE y QA).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
