# CI/CD de identity.
#
# Flujo de ramas y entornos:
#   rama de trabajo --PR--> develop (QA) --PR de release--> main (PROD)
#   - develop = QA:   cada push publica la imagen con los tags  qa, develop, sha-<corto>.
#   - main    = PROD: cada push publica la imagen con los tags  prod, latest, sha-<corto>.
#   - Los PR y workflow_dispatch compilan, prueban y escanean, pero no publican.
#
# SonarQube Cloud solo corre en develop (push a develop y PR con base develop):
#   - el plan Free analiza una única rama, y la rama principal del proyecto en Sonar es "develop";
#   - lo que llega a main es el mismo código que ya pasó el quality gate en develop.
#   En main (push, PR hacia main, workflow_dispatch) se ejecuta mvn verify sin Sonar.
#
# Jobs:
#   secretos   -> Gitleaks sobre todo el historial git.
#   build-test -> compila, pruebas (unitarias, H2 e integración con PostgreSQL vía Testcontainers),
#                 cobertura JaCoCo y, en develop con SONAR_TOKEN, análisis + quality gate en SonarQube Cloud.
#   docker     -> construye la imagen, la escanea con Trivy (siempre) y, solo en push, la publica en GHCR.
# Las actions están fijadas por SHA de commit (inmutable); el comentario indica la versión (runtime Node 24).
name: CI/CD

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secretos:
    name: Secretos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Imagen oficial en vez de gitleaks-action (esa exige licencia en organizaciones).
      # Los falsos positivos revisados están en .gitleaksignore.
      - name: Gitleaks
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo zricethezav/gitleaks:v8.30.1 \
            git /repo --redact --no-banner -v

  build-test:
    name: Compilar, probar y analizar
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # 'true' solo en push a develop o en PR con base develop (la única rama que analiza Sonar).
      SONAR_APLICA: ${{ github.ref == 'refs/heads/develop' || github.base_ref == 'develop' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Sonar necesita el historial para saber qué código es nuevo

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Testcontainers usa el Docker del runner: no hacen falta services de postgres/redis.
      - name: Pruebas + SonarQube Cloud (falla si no pasa el quality gate)
        if: env.SONAR_TOKEN != '' && env.SONAR_APLICA == 'true'
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.qualitygate.wait=true

      - name: Pruebas (sin Sonar)
        if: env.SONAR_TOKEN == '' || env.SONAR_APLICA != 'true'
        run: |
          if [ "$SONAR_APLICA" != "true" ]; then
            if [ "$GITHUB_REF" = "refs/heads/main" ] || [ "$GITHUB_BASE_REF" = "main" ]; then
              echo "::notice::main/PROD: Sonar no aplica; el código ya pasó el quality gate en develop."
            else
              echo "::notice::Sonar solo se ejecuta en push a develop y en PR con base develop (plan Free: una sola rama)."
            fi
          else
            echo "::warning::Falta configurar el secreto SONAR_TOKEN: se omite el análisis de SonarQube Cloud."
          fi
          mvn -B verify

      - name: Reportes de pruebas
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

      - name: Reporte de cobertura
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco
          path: target/site/jacoco/
          if-no-files-found: ignore

  docker:
    name: Imagen Docker (Trivy y publicación)
    needs: [secretos, build-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Tags por entorno: develop -> qa, develop ; main -> prod, latest ; ambos -> sha-<corto>.
      # Solo se publican en push (ver "Publicar imagen"); en PR/dispatch se calculan pero no se suben.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/identity
          flavor: |
            latest=false
          tags: |
            type=raw,value=qa,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=prod,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Primero se construye y se carga en el Docker local (sin publicar) para escanearla.
      - name: Construir imagen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          build-args: GIT_COMMIT=${{ github.sha }}
          tags: identity:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Composite: internamente usa setup-trivy v0.2.6 y actions/cache v5 (ambas Node 24).
      - name: Trivy (vulnerabilidades CRITICAL/HIGH con corrección disponible)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: identity:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
          # Aceptadas sin arreglo en Spring Boot 3.x, con fecha de vencimiento.
          trivyignores: .trivyignore.yaml

      - name: Login a GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Mismo build (sale de la caché) pero publicando con los tags definitivos.
      - name: Publicar imagen
        if: github.event_name == 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          build-args: GIT_COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
