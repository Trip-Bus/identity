spring:
  application:
    name: identity

  datasource:
    url: jdbc:postgresql://${DB_URL:localhost}:5432/tripbus_identity
    username: ${DB_USERNAME:tripbus}
    password: ${DB_PASSWORD:tripbus_local_pw}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

security:
  argon2:
    salt-length: ${ARGON2_SALT_LENGTH:16}
    hash-length: ${ARGON2_HASH_LENGTH:32}
    parallelism: ${ARGON2_PARALLELISM:1}
    memory: ${ARGON2_MEMORY:19456}
    iterations: ${ARGON2_ITERATIONS:2}

  jwt:
    private-key-path: ${JWT_PRIVATE_KEY_PATH:}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:}
    key-id: ${JWT_KEY_ID:identity-key-1}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

  encryption:
    # Llave maestra AES-256 (base64, 32 bytes) para el cifrado en reposo de datos sensibles
    # (ver EncryptionKeyProvider). NUNCA se define un valor literal aqui.
    key: ${IDENTITY_ENCRYPTION_KEY:}

server:
  port: 16001
