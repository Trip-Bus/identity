spring:
  application:
    name: identity

  # "qa" y "prod" activan además el perfil "desplegado" (exige secretos, sin valores por defecto).
  profiles:
    group:
      qa: desplegado
      prod: desplegado

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:18101}/${DB_NAME:tripbus_identity}
    username: ${DB_USERNAME:identity}
    password: ${DB_PASSWORD:identity_qa_pw}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:18100}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

security:
  argon2:
    salt-length: ${ARGON2_SALT_LENGTH:16}
    hash-length: ${ARGON2_HASH_LENGTH:32}
    parallelism: ${ARGON2_PARALLELISM:1}
    memory: ${ARGON2_MEMORY:19456}
    iterations: ${ARGON2_ITERATIONS:2}

  jwt:
    private-key-path: ${JWT_PRIVATE_KEY_PATH:}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:}
    key-id: ${JWT_KEY_ID:identity-key-1}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

server:
  port: ${SERVER_PORT:18001}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # Redis solo se usa para eventos y claves de revocación (best effort): no debe tumbar el readiness.
    redis:
      enabled: false
  metrics:
    tags:
      application: identity
  info:
    env:
      enabled: true

# /actuator/info: commit con el que se construyó la imagen (build-arg GIT_COMMIT del Dockerfile).
info:
  app:
    commit: ${APP_COMMIT:local}

tripbus:
  # Secreto compartido de las llamadas servicio a servicio (/internal/**, header X-Internal-Token).
  internal-token: ${INTERNAL_API_TOKEN:tripbus_internal_qa_token}
  services:
    # US-101: identity valida en catalog la empresa de un OPERADOR/CONDUCTOR.
    catalog-url: ${CATALOG_URL:http://localhost:18002}
  events:
    enabled: ${EVENTS_ENABLED:true}
    stream: ${EVENTS_STREAM:tripbus:events}
  # Enlaces de los correos (recuperación, verificación y aviso de cambio de contraseña).
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  # SMTP, mismas variables que booking. Sin MAIL_HOST no se envía nada: LoggingEmailSender deja el
  # enlace en el log (solo en DEBUG). No es obligatoria en ningún entorno.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: "${MAIL_FROM:TripBus <no-reply@tripbus.co>}"
  demo-users:
    enabled: ${DEMO_USERS_ENABLED:false}
    password: ${DEMO_USERS_PASSWORD:TripBus2026}
  identity:
    login:
      max-attempts: ${IDENTITY_LOGIN_MAX_ATTEMPTS:5}
      window: ${IDENTITY_LOGIN_WINDOW:15m}
      lockout: ${IDENTITY_LOGIN_LOCKOUT:15m}
    refresh-ttl: ${IDENTITY_REFRESH_TTL:14d}
